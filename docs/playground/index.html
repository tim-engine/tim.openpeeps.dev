ne\n      for $item in [\"views\", \"layouts\", \"partials\"]:\n        li: $item\n  script src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js\""}</script></div><footer class="row mb-4"><div class="col-12 text-center opacity-50"><small><small><p class="mt-4 mb-0">Powered by <a href="https://github.com/openpeeps/booyaka">Booyaka</a> &mdash; Made by Humans from <a href="https://openpeeps.dev">OpenPeeps</a></p><p class="mb-0">2026 &copy; OpenPeeps & Contributors | AGPLv3 License</p></small></small></div></footer></div><script type="text/javascript" src="/assets/app.js"></script><script src="https://cdn.jsdelivr.net/npm/ace-builds@1.36.2/src-noconflict/ace.js"></script><script type="text/javascript" src="/assets/tim.js"></script><script type="text/javascript" src="/assets/mode-tim.js"></script><script type="text/javascript" src="/assets/theme-tim.js"></script><script>{document.addEventListener('DOMContentLoaded',function(){var editor=ace.edit('editor',{theme:'ace/theme/dfkup',mode:'ace/mode/dfkup',fontSize:13.5,tabSize:2,useSoftTabs:true,showPrintMargin:false,wrap:true,indentedSoftWrap:false,selectionStyle:'text'});var examples=[];var exampleScripts=document.querySelectorAll('script[type="text/application+json"]');exampleScripts.forEach(function(el){try{examples.push(JSON.parse(el.textContent))}catch(e){}});if(examples.length===0){examples.push({title:'Blank',source:'h1: "Hello, Tim!"'})};var tabsEl=document.getElementById('exampleTabs');function selectExample(i){var btns=tabsEl.querySelectorAll('.example-tab');btns.forEach(function(b,j){b.classList.toggle('active',i===j)});editor.setValue(examples[i].source,-1)};examples.forEach(function(ex,i){var btn=document.createElement('button');btn.className='example-tab'+(i===0?' active':'');btn.textContent=ex.title;btn.addEventListener('click',function(){selectExample(i)});tabsEl.appendChild(btn)});editor.setValue(examples[0].source,-1);editor.focus();editor.commands.addCommand({name:'runTim',bindKey:{win:'Ctrl-Enter',mac:'Command-Enter'},exec:function(){runTim()}});var autoCompile=document.getElementById('autoCompile');var compileTimer=0;editor.on('change',function(){if(!autoCompile.checked)return;clearTimeout(compileTimer);compileTimer=setTimeout(runTim,400)});var consoleEl=document.getElementById('console');var runBtn=document.getElementById('runBtn');var preview=document.getElementById('preview');var tim=null;function writeOutput(text){var line=document.createElement('div');line.className='console-line';line.innerHTML='<span class="console-prompt">></span><span class="console-output">'+String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>';consoleEl.appendChild(line);consoleEl.scrollTop=consoleEl.scrollHeight};writeOutput('loading tim.wasm ...');runBtn.disabled=true;runBtn.style.opacity='0.5';function runTim(){if(!tim){writeOutput('tim.wasm is still loading ...');return};var t0=performance.now();var res=tim.renderView(editor.getValue(),'{}','{}');var ms=(performance.now()-t0).toFixed(1);if(res.code!==0){writeOutput('Error ('+ms+' ms): '+res.out)}else{preview.srcdoc=res.out;writeOutput('ok ('+ms+' ms, '+res.out.length+' chars)')}};TimWasm.loadTimUrl('/assets/tim.wasm').then(function(t){tim=t;var v=tim.version();if(v.code===0){writeOutput('tim '+v.out+' (wasm) ready')}else{writeOutput('version error: '+v.out)};runBtn.disabled=false;runBtn.style.opacity='1';clearTimeout(compileTimer);runTim()}).catch(function(e){writeOutput('Could not load /assets/tim.wasm: '+e)});runBtn.addEventListener('click',runTim);document.getElementById('clearBtn').addEventListener('click',function(){consoleEl.innerHTML='';preview.srcdoc='';writeOutput('ready')});var splitter=document.getElementById('splitter');var outputPanel=document.querySelector('.output-panel');var mainContent=document.querySelector('.main-content');var isDragging=false;splitter.addEventListener('mousedown',function(e){isDragging=true;splitter.classList.add('active');mainContent.classList.add('is-dragging');e.preventDefault()});document.addEventListener('mousemove',function(e){if(!isDragging)return;var containerRect=mainContent.getBoundingClientRect();var newWidth=containerRect.right-e.clientX-2;if(newWidth<200)newWidth=200;if(newWidth>containerRect.width-300)newWidth=containerRect.width-300;outputPanel.style.width=newWidth+'px'});document.addEventListener('mouseup',function(){if(isDragging){isDragging=false;splitter.classList.remove('active');mainContent.classList.remove('is-dragging')}});window.addEventListener('resize',function(){editor.resize()})})}
